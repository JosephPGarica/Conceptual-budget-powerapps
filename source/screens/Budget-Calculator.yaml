      - cal.btn:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =If(
                  IsBlank(Trim(new_sqft_input.Text)) ||
                  !IsNumeric(new_sqft_input.Text) ||
                  Value(new_sqft_input.Text) <= 0,

                  Notify(
                      "Please enter a valid square footage.",
                      NotificationType.Warning
                  ),

                  IsBlank(CD_space_type_input_6.Selected.Title),

                  Notify(
                      "Please select a space type.",
                      NotificationType.Warning
                  ),

                  Set(
                      varBudgetRecord,
                      LookUp(
                          'Budget_$_Data',
                          Title = CD_space_type_input_6.Selected.Title
                      )
                  );

                  If(
                      IsBlank(varBudgetRecord),

                      Notify(
                          "No budget data was found for the selected space type.",
                          NotificationType.Warning
                      ),

                      Set(
                          varSF,
                          Value(new_sqft_input.Text)
                      );

                      Set(
                          varSoftCost,
                          0.22
                      );

                      Set(
                          varMin_Cost,
                          If(
                              varUseTTUOps,
                              Min(
                                  varBudgetRecord.'Repair and Renovation Average Cost, in$/SF plus one standard deviation',
                                  varBudgetRecord.'National Average Renovation $/SF',
                                  varBudgetRecord.'TTU OPs Avg renovation $/SF'
                              ),
                              Min(
                                  varBudgetRecord.'Repair and Renovation Average Cost, in$/SF plus one standard deviation',
                                  varBudgetRecord.'National Average Renovation $/SF'
                              )
                          )
                      );

                      Set(
                          varMax_Cost,
                          If(
                              varUseTTUOps,
                              Max(
                                  varBudgetRecord.'Repair and Renovation Average Cost, in$/SF plus one standard deviation',
                                  varBudgetRecord.'National Average Renovation $/SF',
                                  varBudgetRecord.'TTU OPs Avg renovation $/SF'
                              ),
                              Max(
                                  varBudgetRecord.'Repair and Renovation Average Cost, in$/SF plus one standard deviation',
                                  varBudgetRecord.'National Average Renovation $/SF'
                              )
                          )
                      );

                      Set(
                          varMinUsed,
                          If(
                              varMin_Cost =
                              varBudgetRecord.'Repair and Renovation Average Cost, in$/SF plus one standard deviation',

                              "THECB",

                              If(
                                  varMin_Cost =
                                  varBudgetRecord.'National Average Renovation $/SF',

                                  "National Avg",

                                  If(
                                      varUseTTUOps &&
                                      varMin_Cost =
                                      varBudgetRecord.'TTU OPs Avg renovation $/SF',

                                      "TTU Operations",

                                      ""
                                  )
                              )
                          )
                      );

                      Set(
                          varMaxUsed,
                          If(
                              varMax_Cost =
                              varBudgetRecord.'Repair and Renovation Average Cost, in$/SF plus one standard deviation',

                              "THECB",

                              If(
                                  varMax_Cost =
                                  varBudgetRecord.'National Average Renovation $/SF',

                                  "National Avg",

                                  If(
                                      varUseTTUOps &&
                                      varMax_Cost =
                                      varBudgetRecord.'TTU OPs Avg renovation $/SF',

                                      "TTU Operations",

                                      ""
                                  )
                              )
                          )
                      );

                      Select(Button1_4)
                  )
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="Calculate"
            Width: =200
            X: =1135
            Y: =711
