                                                      varSF *
                                                      (1 + varSoftCost),
                                                      -4
                                                  ),

                                              'High (100%) Budget':
                                                  Round(
                                                      varMax_Cost *
                                                      varSF *
                                                      (1 + varSoftCost),
                                                      -4
                                                  ),

                                              'Low (75%) Budget':
                                                  Round(
