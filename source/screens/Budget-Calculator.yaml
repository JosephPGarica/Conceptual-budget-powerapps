                  - Button1_4:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(0, 0, 0, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(0, 0, 0, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        LayoutGridColumnEnd: =6
                        LayoutGridColumnStart: =5
                        LayoutGridRowEnd: =15
                        LayoutGridRowStart: =14
                        OnSelect: |-
                          =If(
                              IsBlank(Trim(project_number_input.Text)),

                              Notify(
                                  "Please enter an official project number.",
                                  NotificationType.Warning
                              ),

                              Set(
                                  varProjectID,
                                  Trim(project_number_input.Text)
                              );

                              Set(
                                  varSF,
                                  Value(new_sqft_input.Text)
                              );

                              Set(
                                  varActualTotal,
                                  If(
                                      IsBlank(Trim(actual_total.Text)),
                                      Blank(),
                                      Value(actual_total.Text)
                                  )
                              );

                              Set(
                                  varCustomerIdentifier,
                                  If(
                                      IsBlank(varCustomerIdentifier),
                                      Trim(project_input.Text),
                                      varCustomerIdentifier
                                  )
                              );

                              Set(
                                  varExistingInternal,
                                  If(
                                      !IsBlank(varLoadedInternal),

                                      varLoadedInternal,

                                      If(
                                          !IsBlank(varExternalRequestID),

                                          LookUp(
                                              'Budget Data Tracker',
                                              'External ID' = varExternalRequestID
                                          ),

                                          Blank()
                                      )
                                  )
                              );

                              Set(
                                  varProjectNumberRecord,
