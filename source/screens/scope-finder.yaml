      - recalculate_scope_button:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: =27
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |+
              =Set(
                  varArchitecturalScopePct,
                  (
                      (4 * varFloorPct / 100) +
                      (8 * varCeilingPct / 100) +
                      (6 * varWallPct / 100) +
                      (6 * varFramingPct / 100) +
                      (2 * varAccessPct / 100) +
                      (8 * varMillworkPct / 100)
                  ) / 100
              );

              Set(
                  varMPEScopePct,
                  (
                      (13 * varLightingPct / 100) +
                      (15 * varElectricalPct / 100) +
                      (20 * varHVACPct / 100) +
                      (4 * varExhaustPct / 100) +
                      (4 * varPlumbingPct / 100) +
                      (10 * varITPct / 100)
                  ) / 100
              );

              Set(
                  varAdditionalSoftRate,
                  (
                      (13 * varAVPct / 100) +
                      (12 * varFFEPct / 100) +
                      (8 * varAsbestosPct / 100) +
                      (15 * varMovePct / 100)
                  ) / 100
              );

              Set(
                  varSelectedConstructionPct,
                  varArchitecturalScopePct + varMPEScopePct + varAdditionalSoftRate
              );

              Set(
                  varConstructionSF100,
                  Round(
                      varBaseCost * varSelectedConstructionPct,
                      0
                  )
              );

              Set(
                  varConstructionCost100,
                  Round(
                      varConstructionSF100 * varSF,
                      -3
                  )
              );

              Set(
                  varStandardSoftRate,
                  (
                      varDesignPct +
                      varOpsPct +
                      varContingencyPct
                  ) / 100
              );


              Set(
                  varStandardSoftCost100,
                  Round(
                      varConstructionCost100 * varStandardSoftRate,
                      -2
                  )
              );

              Set(
                  varAdditionalSoftCost100,
                  Round(
                      varConstructionCost100 * varAdditionalSoftRate,
                      -2
                  )
              );

              Set(
                  varTotalBudget100,
                  Round(
                      varConstructionCost100 +
                      varStandardSoftCost100 +
                      varAdditionalSoftCost100,
                      -3
                  )
              );

              Set(
                  varTotalPerSF100,
                  If(
                      varSF > 0,
                      Round(varTotalBudget100 / varSF, 0),
                      0
                  )
              );

              Set(
                  varTotalBudgetLow,
                  Round(
                      varTotalBudget100 - (varTotalBudget100 * .20),
                      -3
                  )
              );

              Set(
                  varTotalBudgetHigh,
                  Round(
                      varTotalBudget100 + (varTotalBudget100 * .20),
                      -3
                  )
              );
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =false
            Y: =741
