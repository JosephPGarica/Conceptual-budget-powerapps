            OnSelect: |-
              =// Recalculate the scope and budget before creating the email preview
              Select(recalculate_scope_button);

              // Default recipient
              Set(
                  varScopeEmailTo,
                  "@ttu.edu"
              );

              // Fixed email subject
              Set(
                  varScopeEmailSubject,
                  "Conceptual Scope Budget Estimate & Scope - " & varProjectName
              );

              // Default editable email message
              Set(
                  varScopeEmailMessage,
                  "Good Afternoon," & Char(10) & Char(10)
              );

              // Clear the previously generated preview message
              Set(
                  varScopePreviewMessage,
                  ""
              );

              // Open the email popup
              Set(
                  varShowScopeEmailPreview,
                  true
              );

              // Reset the controls so they display the new default values
              Reset(scope_email_to_input);
              Reset(scope_email_body_input)
