Screens:
  Internal_scope_finder:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Height: =App.Height
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(
            varLoadedInternalScope,
            If(
                !IsBlank(varProjectID),
                LookUp(
                    'Scope Data',
                    'Project Name' = varProjectID
                ),
                Blank()
            )
        );

        If(
            !IsBlank(varLoadedInternalScope),

            Set(varFloorPct, Coalesce(varLoadedInternalScope.Flooring, 0));
            Set(varCeilingPct, Coalesce(varLoadedInternalScope.Ceiling, 0));
            Set(varWallPct, Coalesce(varLoadedInternalScope.'Walls and Wall Finishes', 0));
            Set(varFramingPct, Coalesce(varLoadedInternalScope.'Framing Systems', 0));
            Set(varAccessPct, Coalesce(varLoadedInternalScope.'Access Systems', 0));
            Set(varMillworkPct, Coalesce(varLoadedInternalScope.Millwork, 0));

            Set(varLightingPct, Coalesce(varLoadedInternalScope.Lighting, 0));
            Set(varElectricalPct, Coalesce(varLoadedInternalScope.Electrical, 0));
            Set(varHVACPct, Coalesce(varLoadedInternalScope.HVAC, 0));
            Set(varExhaustPct, Coalesce(varLoadedInternalScope.Exhaust, 0));
            Set(varPlumbingPct, Coalesce(varLoadedInternalScope.Plumbing, 0));
            Set(varITPct, Coalesce(varLoadedInternalScope.IT, 0));

            Set(varDesignPct, Coalesce(varLoadedInternalScope.Design, 15));
            Set(varOpsPct, Coalesce(varLoadedInternalScope.'Operations Management', 4));
            Set(varContingencyPct, Coalesce(varLoadedInternalScope.Contingency, 10));

            Set(varAVPct, Coalesce(varLoadedInternalScope.'A/V', 0));
            Set(varFFEPct, Coalesce(varLoadedInternalScope.'FF&E', 0));
            Set(varAsbestosPct, Coalesce(varLoadedInternalScope.Asbestos, 0));
            Set(varMovePct, Coalesce(varLoadedInternalScope.'Move Support', 0)),

            Set(varFloorPct, 0);
            Set(varCeilingPct, 0);
            Set(varWallPct, 0);
            Set(varFramingPct, 0);
            Set(varAccessPct, 0);
            Set(varMillworkPct, 0);

            Set(varLightingPct, 0);
            Set(varElectricalPct, 0);
            Set(varHVACPct, 0);
            Set(varExhaustPct, 0);
            Set(varPlumbingPct, 0);
            Set(varITPct, 0);

            Set(varDesignPct, 15);
            Set(varOpsPct, 4);
            Set(varContingencyPct, 10);

            Set(varAVPct, 0);
            Set(varFFEPct, 0);
            Set(varAsbestosPct, 0);
            Set(varMovePct, 0)
        );

        Select(recalculate_scope_button)
      Width: =App.Width
    Children:
      - scope_email_button_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(204, 228, 246, 1)
            Font: =Font.'Segoe UI'
            Height: =26
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =Set(
                  varExistingInternalScope,
                  LookUp(
                      'Scope Data',
                      'Project Name' = varProjectID
                  )
              );

              Set(
                  varLoadedInternalScope,
                  Patch(
                      'Scope Data',
                      If(
                          IsBlank(varExistingInternalScope),
                          Defaults('Scope Data'),
                          varExistingInternalScope
                      ),
                      {
                          'Project Name': varProjectID,
                          Building: varBuilding,
                          Rooms: varRooms,
                          'Square Footage': varSF,
                          'Space Type': varSpaceType,

                          'Construction Cost': varConstructionCost100,
                          'Soft Costs': varStandardSoftCost100 + varAdditionalSoftCost100,
                          'Price Per SF': varTotalPerSF100,
                          'Total Budget': varTotalBudget100,
                          'Low Budget Range': varTotalBudgetLow,
                          'High Budget Range': varTotalBudgetHigh,

                          Flooring: varFloorPct,
                          Ceiling: varCeilingPct,
                          'Walls and Wall Finishes': varWallPct,
                          'Framing Systems': varFramingPct,
                          'Access Systems': varAccessPct,
                          Millwork: varMillworkPct,

                          Lighting: varLightingPct,
                          Electrical: varElectricalPct,
                          HVAC: varHVACPct,
                          Exhaust: varExhaustPct,
                          Plumbing: varPlumbingPct,
                          IT: varITPct,

                          Design: varDesignPct,
                          'Operations Management': varOpsPct,
                          Contingency: varContingencyPct,

                          'A/V': varAVPct,
                          'FF&E': varFFEPct,
                          Asbestos: varAsbestosPct,
                          'Move Support': varMovePct,

                          'Architectural Systems': varArchitecturalScopePct,
                          'MPE Systems': varMPEScopePct,
                          'Soft Costs PCT': varStandardSoftRate,
                          'Additional Soft Costs': varAdditionalSoftRate
                      }
                  )
              );

              Notify(
                  If(
                      IsBlank(varExistingInternalScope),
                      "Scope saved successfully.",
                      "Scope changes saved successfully."
                  ),
                  NotificationType.Success
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="save"
            Width: =300
            X: =352
            Y: =739
